name: Validate knowledge and application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check avatar.js
          node --check mascot.js
          node --check motion-core.js
          node --check rig.js
          node --check walk-renderer.js
          node --check walk-flow.js
          node --check admin.js
          node --check demo.js
          node --check github-publisher.js

